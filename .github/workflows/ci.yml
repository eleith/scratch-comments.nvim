name: ci

on:
  push:
    branches: [main]
    # A push filter with only `branches` excludes tag pushes, so tags must be
    # listed explicitly.
    tags: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Neovim, lua-language-server and stylua, pinned. Built from
    # git.eleith.com/eleith/containers (nvim).
    container: ghcr.io/eleith/containers-nvim:0.12.1-luals3.19.1-stylua2.5.2
    steps:
      - uses: actions/checkout@v4
      - run: make lint
      - run: make fmt-check
      - run: make test

# Conditions are OR'd: push to main, any pull request, any tag.
when:
  - event: push
    branch: main
  - event: [pull_request, tag]

variables:
  # Neovim, lua-language-server and stylua, pinned. Built from
  # git.eleith.com/eleith/containers (nvim).
  - &image git.eleith.com/eleith.private/nvim:0.12.1-luals3.19.1-stylua2.5.2

steps:
  - name: lint
    image: *image
    commands:
      - make lint

  - name: fmt
    image: *image
    commands:
      - make fmt-check

  - name: test
    image: *image
    commands:
      - make test
